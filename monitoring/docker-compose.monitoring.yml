version: '3.9'

services:

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
    networks:
      - mlops   # <- IMPORTANT : dans le même réseau que l'API

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - mlops   # <- IMPORTANT aussi

volumes:
  grafana-data:

networks:
  mlops:
    external: true   # <- On utilise le même réseau créé depuis l'autre compose
